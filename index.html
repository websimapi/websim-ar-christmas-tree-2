<html><head><base href=".">
<title>AR Christmas Tree</title>
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
<style>
    .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }

    .arjs-loader.hidden {
        display: none;
    }

    [style*="Show the Hiro marker"] {
        display: none;
    }

    .gps-status {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 10px;
        border-radius: 5px;
        z-index: 1000;
        font-size: 14px;
    }
</style>
</head>

<body style="margin: 0px; overflow: hidden;">
    <audio id="christmasMusic" loop autoplay>
        <source src="1-5. Christmas Time Is Here (Instrumental).mp3" type="audio/mpeg">
    </audio>

    <div class="arjs-loader">
        <div>
            Loading GPS-based AR Christmas Tree...
            <div style="font-size: 0.8em; margin-top: 10px;">
                Please allow location access to place the tree
            </div>
        </div>
    </div>

    <div class="gps-status" id="gpsStatus">
        <div>🛰️ GPS Status: <span id="gpsText">Acquiring...</span></div>
        <div>📍 Position: <span id="positionText">Unknown</span></div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">

        <!-- GPS Entity for Christmas Tree -->
        <a-entity id="treeLocation" gps-entity-place="latitude: 0; longitude: 0; altitude: 0">
            <!-- Christmas Tree -->
            <a-entity position="0 0 0">
                <!-- Snow Pile -->
                <a-entity position="0 -1 0">
                    <a-sphere position="0 0 0" radius="4" scale="1 0.15 1" color="#ffffff"></a-sphere>
                    <a-sphere position="3 0.1 2.5" radius="2" scale="1 0.12 1" color="#ffffff"></a-sphere>
                    <a-sphere position="-2.8 0.08 -2.2" radius="2.2" scale="1 0.1 1" color="#ffffff"></a-sphere>
                    <a-sphere position="2.2 0.05 -3" radius="1.8" scale="1 0.08 1" color="#ffffff"></a-sphere>
                    <a-sphere position="-3.2 0.07 1.8" radius="2" scale="1 0.11 1" color="#ffffff"></a-sphere>
                    <a-sphere position="1.8 0.06 2.8" radius="1.7" scale="1 0.09 1" color="#ffffff"></a-sphere>
                    <a-sphere position="3.5 0.03 -1.5" radius="1.6" scale="1 0.07 1" color="#f0f0f0"></a-sphere>
                    <a-sphere position="-3.2 0.04 2.2" radius="1.8" scale="1 0.06 1" color="#f8f8f8"></a-sphere>
                    <a-sphere position="2.8 0.05 3.2" radius="1.5" scale="1 0.08 1" color="#f5f5f5"></a-sphere>
                    <a-sphere position="-2.5 0.06 -3.5" radius="1.7" scale="1 0.07 1" color="#f2f2f2"></a-sphere>
                </a-entity>

                <!-- Tree Trunk -->
                <a-cylinder position="0 0 0" radius="0.2" height="1" color="#8B4513"></a-cylinder>
                
                <!-- Tree Layers -->
                <a-cone position="0 1.5 0" radius-bottom="1.6" radius-top="0" height="2" color="#2d5a27">
                    <a-animation attribute="rotation" dur="3000" to="0 360 0" repeat="indefinite" easing="linear"></a-animation>
                </a-cone>
                <a-cone position="0 2.5 0" radius-bottom="1.2" radius-top="0" height="1.6" color="#387c2f">
                    <a-animation attribute="rotation" dur="3000" to="0 -360 0" repeat="indefinite" easing="linear"></a-animation>
                </a-cone>
                <a-cone position="0 3.3 0" radius-bottom="0.8" radius-top="0" height="1.2" color="#2d5a27">
                    <a-animation attribute="rotation" dur="3000" to="0 360 0" repeat="indefinite" easing="linear"></a-animation>
                </a-cone>

                <!-- Custom W Star on top -->
                <a-entity position="0 4 0">
                    <a-entity position="0 0 0" scale="0.3 0.3 0.3">
                        <!-- W letter made from boxes -->
                        <a-entity position="0 0 0">
                            <!-- Left stroke -->
                            <a-box position="-0.4 0 0" width="0.2" height="1" depth="0.2" material="color: #FFD700">
                            </a-box>
                            
                            <!-- Left-middle stroke -->
                            <a-box position="-0.1 -0.3 0" width="0.2" height="0.7" depth="0.2" rotation="0 0 30" material="color: #40E0D0">
                            </a-box>
                            
                            <!-- Right-middle stroke -->
                            <a-box position="0.1 -0.3 0" width="0.2" height="0.7" depth="0.2" rotation="0 0 -30" material="color: #4169E1">
                            </a-box>
                            
                            <!-- Right stroke -->
                            <a-box position="0.4 0 0" width="0.2" height="1" depth="0.2" material="color: #FF69B4">
                            </a-box>

                            <a-animation attribute="rotation" dur="5000" to="0 360 0" repeat="indefinite" easing="linear">
                            </a-animation>
                            <a-animation attribute="position" dur="1000" direction="alternate" to="0 0.2 0" repeat="indefinite">
                            </a-animation>
                        </a-entity>
                    </a-entity>
                </a-entity>

                <!-- Snow Particles -->
                <a-entity id="snowContainer"></a-entity>
            </a-entity>
        </a-entity>

        <!-- Camera -->
        <a-camera gps-new-camera="gpsMinDistance: 5" rotation-reader look-controls="enabled: true">
        </a-camera>
    </a-scene>

    <script>
let treeLatitude = null;
let treeLongitude = null;

// GPS Location Management
function initializeTreeLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                treeLatitude = position.coords.latitude;
                treeLongitude = position.coords.longitude;
                
                const treeLocation = document.getElementById('treeLocation');
                treeLocation.setAttribute('gps-entity-place', {
                    latitude: treeLatitude,
                    longitude: treeLongitude,
                    altitude: 0
                });
                
                document.getElementById('gpsText').textContent = 'Connected';
                document.getElementById('positionText').textContent = 
                    `${treeLatitude.toFixed(6)}, ${treeLongitude.toFixed(6)}`;
                
                // Hide loader when GPS is acquired
                document.querySelector('.arjs-loader').classList.add('hidden');
            },
            (error) => {
                console.error('GPS Error:', error);
                document.getElementById('gpsText').textContent = 'Error';
                document.getElementById('positionText').textContent = 'Location access denied';
                
                // Fallback to default position if GPS fails
                document.querySelector('.arjs-loader').classList.add('hidden');
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 300000
            }
        );
    } else {
        document.getElementById('gpsText').textContent = 'Not supported';
        document.getElementById('positionText').textContent = 'Geolocation not supported';
        
        // Fallback to default position
        document.querySelector('.arjs-loader').classList.add('hidden');
    }
}

const snowContainer = document.getElementById('snowContainer');
const snowflakeCount = 50;
let snowflakes = [];
for (let i = 0; i < snowflakeCount; i++) {
  const snowflake = document.createElement('a-sphere');
  snowflake.setAttribute('radius', '0.03');
  snowflake.setAttribute('color', '#ffffff');
  snowflake.setAttribute('opacity', '0.8');
  const x = (Math.random() - 0.5) * 4;
  const y = Math.random() * 5 + 5;
  const z = (Math.random() - 0.5) * 4;
  snowflake.setAttribute('position', `${x} ${y} ${z}`);
  snowContainer.appendChild(snowflake);
  snowflakes.push({
    element: snowflake,
    velocity: Math.random() * 0.01 + 0.01,
    wobble: Math.random() * 0.01
  });
}
function animateSnow() {
  snowflakes.forEach(snowflake => {
    const pos = snowflake.element.getAttribute('position');
    pos.y -= snowflake.velocity;
    pos.x += Math.sin(Date.now() * 0.001) * snowflake.wobble;
    if (pos.y < 0) {
      pos.y = 5 + Math.random() * 2;
      pos.x = (Math.random() - 0.5) * 4;
      pos.z = (Math.random() - 0.5) * 4;
    }
    snowflake.element.setAttribute('position', pos);
  });
  requestAnimationFrame(animateSnow);
}
animateSnow();
window.addEventListener('click', () => {
  document.getElementById('christmasMusic').play();
});

// Initialize GPS-based tree placement
setTimeout(initializeTreeLocation, 1000);
</script>

</body></html>
